<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hex Encoder/Decoder</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Hex Encoder & Decoder</h1>
        <div class="card p-4">
            <div class="mb-3">
                <label for="inputText" class="form-label">Nhập nội dung:</label>
                <textarea id="inputText" class="form-control" rows="4" placeholder="Nhập văn bản cần mã hóa/giải mã..."></textarea>
            </div>
            <div class="mb-3">
                <button class="btn btn-primary w-100" onclick="encodeToHex()">Encode to Hex</button>
                <button class="btn btn-secondary w-100 mt-2" onclick="decodeFromHex()">Decode from Hex</button>
            </div>
            <div class="mb-3">
                <label for="outputText" class="form-label">Kết quả:</label>
                <textarea id="outputText" class="form-control" rows="4" readonly></textarea>
            </div>
            <button class="btn btn-success w-100" onclick="sendToTelegram()">Gửi kết quả qua Telegram</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
